[package]
name = "nostalgia"
description = "Bring a bit of nostalgia to your day"
version = "26.11.24"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/nostalgia-rs/nostalgia"
keywords = ["nostalgia", "wallpaper", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["cargo", "color", "derive", "error-context", "help", "suggestions", "usage", "wrap_help"] }
confy = "2.0.0"
dirs = "7.0.0"
polars = { version = "0.55.2", features = ["csv", "lazy", "random"] }
rand = "0.10.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
cargo-llvm-cov = "0.9.2"

[badges.maintenance]
status = "actively-developed"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3          # Use "z" or "s" instead if optimizing for small binary size
lto = true             # Enables Link-Time Optimization across crates
codegen-units = 1      # Allows better optimization by reducing parallel codegen
panic = "abort"        # Removes stack-unwinding overhead on panic
strip = true           # Automatically strips symbols from the binary
